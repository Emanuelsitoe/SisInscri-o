<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscribe | Turma dos Revoltados</title>
    <link rel="stylesheet" href="CSS/selecao.css">
    <link rel="stylesheet" href="CSS/tr.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body class="light-mode">

    <header class="main-header">
        <button onclick="handleBack()" class="icon-btn"><span class="material-icons-outlined">arrow_back</span></button>
        <span id="header-title" class="step-title">PERFIL DA INSTITUIÇÃO</span>
        <div class="spacer"></div>
    </header>

    <main class="content-container" id="main-stage">
        </main>

    <dialog id="modalPagamento" class="modern-modal">
        <div class="modal-body">
            <span class="close-modal" onclick="closePayment()">×</span>
            <div class="payment-header">
                <h3 class="section-label">PAGAMENTO VIA M-PESA</h3>
                <span class="badge-price" id="display-price">0.00 MT</span>
            </div>
            <div class="payment-card">
                <div class="mpesa-brand">
                    <span class="mpesa-logo">M-Pesa</span>
                    <span class="mpesa-text">Transação Segura</span>
                </div>
                <div class="input-group">
                    <label>Número de Telefone</label>
                    <div class="phone-wrapper">
                        <span class="prefix">+258</span>
                        <input type="tel" id="phone" placeholder="84 123 4567">
                    </div>
                </div>
                <p class="helper-text">Você receberá um prompt no celular para confirmar o PIN.</p>
            </div>
            <button class="btn-primary-full" onclick="processPayment()">Confirmar e Pagar</button>
        </div>
    </dialog>

    <button class="theme-toggle" onclick="toggleTheme()">
        <span class="material-icons-outlined" id="theme-icon">dark_mode</span>
    </button>

    <script src="JS/instituicao.js"></script>
    <script src="JS/tr.js"></script>
</body>
</html>
